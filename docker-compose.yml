services:
  mynav:
    image: registry.cn-hangzhou.aliyuncs.com/fengmuxi-docker-images/mynav:latest
    container_name: mynav
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/database.db
      - UPLOADS_PATH=/app/uploads
      - PUBLIC_DIR=/app/public
      - JWT_SECRET=${JWT_SECRET:-xK9mP2nL4vQ8wR1tS6yU3zX5cV0bFhJ7}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-123456}
    volumes:
      - ./data/database:/app/data
      - ./data/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health", "||", "exit", "1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
